name: Recorder and archive CI
on:
  pull_request:
  # Not on tags: a release's commit was tested here on main, and the release workflow tests it again.
  push:
    branches: [main]

permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14t'
      - uses: dtolnay/rust-toolchain@stable
      # The tests run brisk-parquet (the archive's checks of a broker's day), so it is built first.
      - run: cargo build --release --locked --manifest-path rust/brisk_parquet/Cargo.toml
      - run: python -m pip install -r requirements-dev.txt -e .
      - name: No dependency turns the GIL back on
        run: python -c "import sys, numpy, pyarrow, pandas, briskapi; assert not sys._is_gil_enabled(), 'the GIL is on'"
      - run: python -m pytest tests --cov=archive_service --cov=query_engine --cov=query_service --cov=briskapi --cov-fail-under=85
      - run: python -m pytest tools/brisk_mock/test_download.py tools/brisk_mock/test_sbi_master_layout.py
      # The demo's files are pinned by hash (briskapi/decoder/assets.json): fetched from BRiSK's demo site once,
      # then kept here, as download_mock.py leaves alone a file that matches its pin.
      - uses: actions/cache@v4
        with:
          path: /tmp/brisk-mock-cache
          key: brisk-demo-${{ hashFiles('briskapi/decoder/assets.json') }}
      - run: python tools/brisk_mock/download_mock.py --cache /tmp/brisk-mock-cache
      - name: Verify archive reference against the pinned demo replay
        run: python -m pytest tools/brisk_mock/test_reference.py
        env:
          BRISK_MOCK_CACHE: /tmp/brisk-mock-cache
      # Without --experimental-test-coverage: it held some 6 GB more per file (each decoder's WebAssembly), and
      # three files at once ran the runner out of memory.
      - run: node --test tools/brisk_mock/*.test.cjs
        env:
          BRISK_MOCK_CACHE: /tmp/brisk-mock-cache
      - name: Smoke-test the wheel outside the repository
        working-directory: /tmp
        run: |
          python -m pip wheel --no-deps -w /tmp/dist "$GITHUB_WORKSPACE"
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install /tmp/dist/briskapi-*.whl
          /tmp/wheel-venv/bin/python -I -c "import briskapi.cli as c, briskapi.schema as s; assert c.DECODER.exists() and 'historical_mock' in s.REFERENCES"
          /tmp/wheel-venv/bin/brisk live --site demo --cache /tmp/brisk-mock-cache --codes 7203 --speed 0 --limit-frames 3 --quotes > /tmp/live.jsonl
          /tmp/wheel-venv/bin/python -c "import json; rows = [json.loads(l) for l in open('/tmp/live.jsonl')]; assert rows and all(r['code'] == '7203' for r in rows)"
      - run: cargo test --locked --manifest-path rust/brisk_quote_ingest/Cargo.toml
        env:
          BRISK_MOCK_CACHE: /tmp/brisk-mock-cache
      - run: cargo fmt --manifest-path rust/brisk_quote_ingest/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path rust/brisk_quote_ingest/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path rust/brisk_parquet/Cargo.toml
      - run: cargo fmt --manifest-path rust/brisk_parquet/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path rust/brisk_parquet/Cargo.toml --all-targets -- -D warnings
